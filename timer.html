<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path 1.0</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@160..700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="path-logo.png">
<head>
    <title>Path 1.0 Timer</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: #f6f8fa;
            margin: 0;
            font-family: 'Readex Pro', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #timer {
            background: #fff;
            color: #22223b;
            padding: 40px 80px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(60,60,100,0.12), 0 1.5px 4px rgba(60,60,100,0.08);
            font-size: 3em;
            letter-spacing: 0.1em;
            font-weight: 600;
            transition: box-shadow 0.2s;
        }
        #timer:hover {
            box-shadow: 0 12px 40px rgba(60,60,100,0.18), 0 2px 8px rgba(60,60,100,0.10);
        }
        .timer-controls {
            margin-top: 24px;
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        .timer-controls button {
            padding: 10px 32px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            background: #22223b;
            color: #fff;
            cursor: pointer;
            font-family: 'Readex Pro', sans-serif;
            font-weight: 500;
            transition: background 0.2s;
        }
        .timer-controls button:hover {
            background: #4a4e69;
        }
    </style>
    </head>
    <body>
        <div class="navigation">
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="About Path.html">About Path</a></li>
                    <li><a href="clock.html">Clock</a></li>
                    <li><a href="calculator.html">Calculator</a></li>
                    <li><a href="timer.html">Timer</a></li>
                </ul>
            </nav>
        </div>
        <div id="timer">00:00</div>
        <div class="timer-controls">
            <button id="startBtn">Start</button>
            <button id="stopBtn">Stop</button>
        </div>
        <script>
            let seconds = 0;
            let timerInterval = null;

            function updateTimer() {
                const min = String(Math.floor(seconds / 60)).padStart(2, '0');
                const sec = String(seconds % 60).padStart(2, '0');
                document.getElementById('timer').textContent = `${min}:${sec}`;
                seconds++;
            }

            function startTimer() {
                if (!timerInterval) {
                    timerInterval = setInterval(updateTimer, 1000);
                }
            }

            function stopTimer() {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            document.getElementById('startBtn').addEventListener('click', startTimer);
            document.getElementById('stopBtn').addEventListener('click', stopTimer);

            // Initialize display
            updateTimer();
        </script>
    </body>
